[project]
name = "lingxi-agent-runtime"
version = "0.1.0"
description = "Lingxi Agent Runtime (Python 3.11 + LangGraph)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "langgraph>=0.2.55,<0.4",
  "langchain-core>=0.3.0,<0.4",
  "langchain-openai>=0.2.0,<0.3",
  "langchain-text-splitters>=0.3.0,<0.4",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
lingxi-agent-runtime = "lingxi_agent_runtime.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingxi_agent_runtime"]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]